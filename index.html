<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Das Streben nach Gleichgewicht</title>
<meta name="description" content="">
<!-- Structure only. Design: theme/ · texts: content/texts.de.js · layout: css/ · behaviour: js/ -->
<script src="js/view.js" data-app="streben"></script>
<link rel="stylesheet" href="theme/theme.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <a class="logo" href="#start" data-brand="logo"></a>
  <div class="top-right">
    <nav class="nav" data-t-aria="nav.aria">
      <a href="#stufe-1" data-route="stufe-1"><span class="num">1</span><span data-t="nav.s1"></span></a>
      <a href="#stufe-2" data-route="stufe-2"><span class="num">2</span><span data-t="nav.s2"></span></a>
      <a href="#stufe-3" data-route="stufe-3"><span class="num">3</span><span data-t="nav.s3"></span></a>
    </nav>
    <button type="button" class="view-toggle"></button>
  </div>
</header>

<main>

<!-- ================= START ================= -->
<section class="part" id="part-start" data-stage="start" hidden>
  <div class="poster">
    <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
    <svg class="l2" viewBox="0 0 100 100" aria-hidden="true"><path d="M0 50 A50 50 0 0 1 100 50 Z" fill="currentColor"/><path d="M0 100 A50 50 0 0 1 100 100 Z" fill="currentColor"/></svg>
    <svg class="l3" viewBox="0 0 400 400" aria-hidden="true"><path d="M200 30 C200 30 90 170 90 240 a110 110 0 0 0 220 0 C310 170 200 30 200 30 Z"/><circle cx="200" cy="245" r="60"/></svg>
    <div class="poster-text">
      <p class="kicker" data-t="start.kicker"></p>
      <h1 class="headline" data-t-html="start.headline"></h1>
      <p class="lead" data-t="start.lead"></p>
    </div>
  </div>
  <div class="page">
    <h2 class="h2-short" data-t="start.partsTitle"></h2>
    <ul class="parts">
      <li><a href="#stufe-1" data-t-html="start.parts.s1"></a></li>
      <li><a href="#stufe-2" data-t-html="start.parts.s2"></a></li>
      <li><a href="#stufe-3" data-t-html="start.parts.s3"></a></li>
    </ul>
    <div class="next-part"><a class="btn big primary" href="#stufe-1" data-t="start.next"></a></div>
  </div>
</section>

<!-- ================= STAGE 1 – particle box ================= -->
<section class="part" id="part-stufe-1" data-stage="stufe-1" hidden>
  <div class="poster small">
    <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
    <svg class="l2" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 0 A50 50 0 0 1 50 100 Z" fill="currentColor"/><path d="M50 0 A50 50 0 0 0 50 100 Z" fill="currentColor" transform="translate(-6 0)"/></svg>
    <svg class="l3" viewBox="0 0 400 400" aria-hidden="true"><circle cx="160" cy="200" r="120"/><circle cx="250" cy="200" r="120"/></svg>
    <div class="poster-text">
      <p class="kicker" data-t="s1.kicker"></p>
      <h2 class="headline" data-t-html="s1.headline"></h2>
      <p class="lead" data-t="s1.lead"></p>
    </div>
  </div>
  <div class="page">
    <div class="lab">
      <div class="lab-pre">
        <div class="row">
          <div class="seg" role="group" data-t-aria="s1.modesAria" id="s1modes">
            <button type="button" class="btn" data-mode="dichte" aria-pressed="true" data-t="s1.modes.dichte"></button>
            <button type="button" class="btn" data-mode="waerme" aria-pressed="false" data-t="s1.modes.waerme"></button>
          </div>
          <button type="button" class="info" aria-controls="s1-note" data-t-aria="s1.infoAria"></button>
        </div>
        <div class="info-note" id="s1-note" hidden data-t-html="s1.meterNote"></div>
      </div>
      <div class="lab-stage">
        <div class="stage-frame square fit sim-frame" id="f1">
          <div class="meter" id="m1"><span class="meter-label" data-t="meter.label"></span><div class="meter-track"><div class="meter-fill"></div><div class="meter-zero"></div></div><span class="meter-val"></span></div>
          <canvas id="c1" data-t-aria="s1.canvasAria"></canvas>
        </div>
      </div>
      <div class="lab-post">
        <div class="controls">
          <button type="button" class="btn big primary" id="s1wall" data-t="s1.wallOpen"></button>
          <button type="button" class="btn big" id="s1reset"><span><span data-t="s1.reset"></span><span class="sub" data-t="s1.resetSub"></span></span></button>
        </div>
        <p class="readout" id="s1read" aria-live="polite"></p>
        <p class="hint" id="s1hint"></p>
        <button type="button" class="btn task-open" aria-controls="s1dlg" aria-haspopup="dialog"><span data-t="kit.tasks"></span><span class="count"></span></button>
        <dialog class="task-dlg" id="s1dlg" data-t-aria="kit.tasks">
          <div class="tasks" id="s1tasks">
            <h3 data-t="s1.tasks.title"></h3>
            <p class="task-intro" data-t="s1.tasks.intro"></p>
            <ul>
              <li data-task="dichte"><span class="box"></span><span data-t="s1.tasks.dichte"></span></li>
              <li data-task="waerme"><span class="box"></span><span data-t="s1.tasks.waerme"></span></li>
            </ul>
            <p class="status" id="s1status" aria-live="polite"></p>
          </div>
          <button type="button" class="btn big" data-close data-t="kit.close"></button>
        </dialog>
        <div class="merke locked" data-for="s1tasks">
          <h3 data-t="kit.merke"></h3>
          <p data-t="s1.merke"></p>
          <span class="locked-note"></span>
        </div>
      </div>
    </div>
    <div class="same">
      <h2 class="h2-short" data-t="s1.same.title"></h2>
      <p class="same-lead" data-t="s1.same.lead"></p>
      <ul class="same-list">
        <li><b data-t="s1.same.heat.title"></b><span data-t="s1.same.heat.text"></span></li>
        <li><b data-t="s1.same.water.title"></b><span data-t="s1.same.water.text"></span></li>
        <li><b data-t="s1.same.current.title"></b><span data-t="s1.same.current.text"></span></li>
        <li><b data-t="s1.same.wind.title"></b><span data-t="s1.same.wind.text"></span></li>
      </ul>
    </div>
    <div class="topics">
      <details class="topic"><summary data-t="s1.topics.back.title"></summary><div class="topic-body" data-t-html="s1.topics.back.body"></div></details>
      <details class="topic"><summary data-t="s1.topics.model.title"></summary><div class="topic-body" data-t-html="s1.topics.model.body"></div></details>
    </div>
    <div class="next-part"><a class="btn big" href="#stufe-2" data-t="s1.next"></a></div>
  </div>
</section>

<!-- ================= STAGE 2 – sea breeze ================= -->
<section class="part" id="part-stufe-2" data-stage="stufe-2" hidden>
  <div class="poster small">
    <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
    <svg class="l2" viewBox="0 0 100 100" aria-hidden="true"><path d="M5 95 A45 45 0 0 1 95 95 L75 95 A25 25 0 0 0 25 95 Z" fill="currentColor"/></svg>
    <svg class="l3" viewBox="0 0 400 400" aria-hidden="true"><path d="M200 20 L222 178 L380 200 L222 222 L200 380 L178 222 L20 200 L178 178 Z"/></svg>
    <div class="poster-text">
      <p class="kicker" data-t="s2.kicker"></p>
      <h2 class="headline" data-t-html="s2.headline"></h2>
      <p class="lead" data-t="s2.lead"></p>
    </div>
  </div>
  <div class="page">
    <div class="lab">
      <div class="lab-pre">
        <div class="controls">
          <div class="range"><label for="s2time" data-t="s2.time"></label><input type="range" id="s2time" min="0" max="24" step="0.1" value="13"><output id="s2clock" for="s2time"></output></div>
          <button type="button" class="info" aria-controls="s2-note" data-t-aria="s2.infoAria"></button>
        </div>
      </div>
      <div class="lab-stage">
        <div class="stage-frame wide fit sim-frame" id="f2">
          <div class="meter" id="m2"><span class="meter-label" data-t="meter.label"></span><div class="meter-track"><div class="meter-fill"></div><div class="meter-zero"></div></div><span class="meter-val"></span></div>
          <canvas id="c2" data-t-aria="s2.canvasAria"></canvas>
        </div>
      </div>
      <div class="lab-post">
        <div class="info-note" id="s2-note" hidden data-t-html="s2.note"></div>
        <div class="dev-only dev-box">
          <h3 data-t="kit.devTitle"></h3>
          <div class="controls">
            <button type="button" class="btn" id="s2sun" aria-pressed="true" data-t="s2.sunOn"></button>
          </div>
          <div class="seg" role="group" data-t-aria="s2.showAria">
            <button type="button" class="btn" data-toggle="arrows" aria-pressed="true" data-t="s2.show.arrows"></button>
            <button type="button" class="btn" data-toggle="isobars" aria-pressed="true" data-t="s2.show.isobars"></button>
            <button type="button" class="btn" data-toggle="smoke" aria-pressed="true" data-t="s2.show.smoke"></button>
            <button type="button" class="btn" data-toggle="tracers" aria-pressed="true" data-t="s2.show.tracers"></button>
          </div>
        </div>
        <p class="readout" id="s2read" aria-live="polite"></p>
        <p class="hint" data-t="s2.hint"></p>
        <button type="button" class="btn task-open" aria-controls="s2dlg" aria-haspopup="dialog"><span data-t="kit.tasks"></span><span class="count"></span></button>
        <dialog class="task-dlg" id="s2dlg" data-t-aria="kit.tasks">
          <div class="tasks" id="s2tasks">
            <h3 data-t="s2.tasks.title"></h3>
            <p class="task-intro" data-t-html="s2.tasks.intro"></p>
            <button type="button" class="btn primary" id="s2task" data-t="s2.tasks.start"></button>
            <ul>
              <li data-task="boat"><span class="box"></span><span data-t="s2.tasks.boat"></span></li>
              <li data-task="night"><span class="box"></span><span data-t="s2.tasks.night"></span></li>
            </ul>
            <p class="status" id="s2status" aria-live="polite"></p>
          </div>
          <button type="button" class="btn big" data-close data-t="kit.close"></button>
        </dialog>
        <div class="merke locked" data-for="s2tasks">
          <h3 data-t="kit.merke"></h3>
          <p data-t="s2.merke"></p>
          <span class="locked-note"></span>
        </div>
      </div>
    </div>
    <div class="topics">
      <details class="topic"><summary data-t="s2.topics.why.title"></summary><div class="topic-body" data-t-html="s2.topics.why.body"></div></details>
      <details class="topic"><summary data-t="s2.topics.model.title"></summary><div class="topic-body" data-t-html="s2.topics.model.body"></div></details>
    </div>
    <div class="next-part"><a class="btn big" href="#stufe-3" data-t="s2.next"></a></div>
  </div>
</section>

<!-- ================= STAGE 3 – weather map ================= -->
<section class="part" id="part-stufe-3" data-stage="stufe-3" hidden>
  <div class="poster small">
    <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
    <svg class="l2" viewBox="0 0 100 100" aria-hidden="true"><path d="M0 70 L20 40 L40 70 L60 40 L80 70 L100 40 L100 60 L80 90 L60 60 L40 90 L20 60 L0 90 Z" fill="currentColor"/></svg>
    <svg class="l3" viewBox="0 0 400 400" aria-hidden="true"><path d="M110 280 a70 70 0 0 1 10 -138 a90 90 0 0 1 170 20 a60 60 0 0 1 -10 118 Z"/><circle cx="150" cy="330" r="6"/><circle cx="210" cy="345" r="6"/><circle cx="270" cy="330" r="6"/></svg>
    <div class="poster-text">
      <p class="kicker" data-t="s3.kicker"></p>
      <h2 class="headline" data-t-html="s3.headline"></h2>
      <p class="lead" data-t="s3.lead"></p>
    </div>
  </div>
  <div class="page">
    <div class="lab">
      <div class="lab-pre">
        <div class="seg view-seg" role="group" data-t-aria="s3.viewAria" id="s3view">
          <button type="button" class="btn" data-view="top" aria-pressed="true" data-t="s3.viewTop"></button>
          <button type="button" class="btn" data-view="side" aria-pressed="false" data-t="s3.viewSide"></button>
        </div>
        <div class="range cut-range" id="s3cutRow" hidden><label for="s3cut" data-t="s3.cut"></label><input type="range" id="s3cut" min="31" max="71" step="0.5" value="52"><output id="s3cutVal" for="s3cut"></output></div>
        <div class="seg" role="group" data-t-aria="s3.brushAria" id="s3brush">
          <button type="button" class="btn" data-brush="1" aria-pressed="true" data-t="s3.brushHigh"></button>
          <button type="button" class="btn" data-brush="-1" aria-pressed="false" data-t="s3.brushLow"></button>
        </div>
      </div>
      <div class="lab-stage">
        <div class="stage-frame square fit sim-frame" id="f3">
          <div class="meter" id="m3"><span class="meter-label" data-t="meter.label"></span><div class="meter-track"><div class="meter-fill"></div><div class="meter-zero"></div></div><span class="meter-val"></span></div>
          <canvas id="c3" class="paint" data-t-aria="s3.canvasAria"></canvas>
        </div>
      </div>
      <div class="lab-post">
        <div class="controls">
          <button type="button" class="btn" id="s3rot" aria-pressed="false" data-t="s3.rot"></button>
          <button type="button" class="info" aria-controls="s3-note" data-t-aria="s3.rotInfoAria"></button>
        </div>
        <div class="info-note" id="s3-note" hidden data-t-html="s3.rotNote"></div>
        <div class="dev-only dev-box">
          <h3 data-t="kit.devTitle"></h3>
          <div class="controls">
            <button type="button" class="btn" id="s3sun" aria-pressed="false" data-t="s3.sunOff"></button>
            <button type="button" class="btn" id="s3arrows" aria-pressed="true" data-t="s3.arrows"></button>
          </div>
        </div>
        <p class="readout" id="s3read" aria-live="polite"></p>
        <p class="hint" data-t="s3.hint"></p>
        <button type="button" class="btn task-open" aria-controls="s3dlg" aria-haspopup="dialog"><span data-t="kit.tasks"></span><span class="count"></span></button>
        <dialog class="task-dlg" id="s3dlg" data-t-aria="kit.tasks">
          <div class="tasks" id="s3tasks">
            <h3 data-t="s3.tasks.title"></h3>
            <ul>
              <li data-task="sturm"><span class="box"></span><span data-t="s3.tasks.sturm"></span></li>
              <li data-task="wirbel"><span class="box"></span><span data-t="s3.tasks.wirbel"></span></li>
              <li data-task="still"><span class="box"></span><span data-t="s3.tasks.still"></span></li>
            </ul>
            <p class="status" id="s3status" aria-live="polite"></p>
          </div>
          <button type="button" class="btn big" data-close data-t="kit.close"></button>
        </dialog>
        <div class="merke locked" data-for="s3tasks">
          <h3 data-t="kit.merke"></h3>
          <p data-t="s3.merke"></p>
          <span class="locked-note"></span>
        </div>
      </div>
    </div>
    <div class="topics">
      <details class="topic"><summary data-t="s3.topics.rot.title"></summary><div class="topic-body" data-t-html="s3.topics.rot.body"></div></details>
      <details class="topic"><summary data-t="s3.topics.model.title"></summary><div class="topic-body" data-t-html="s3.topics.model.body"></div></details>
    </div>
    <div class="next-part"><a class="btn big" href="#start" data-t="s3.next"></a></div>
  </div>
</section>

</main>

<footer class="foot">
  <p class="brand-line" data-brand="line"></p>
  <button type="button" class="dev-link" data-dev-link aria-pressed="false"></button>
</footer>

<script src="theme/theme.js"></script>
<script src="content/texts.de.js"></script>
<script src="js/texts.js"></script>
<script src="js/brand.js"></script>
<script src="js/kit.js"></script>
<script src="js/common.js"></script>
<script src="js/stage1.js"></script>
<script src="js/stage2.js"></script>
<script src="js/stage3.js"></script>
<script src="js/app.js"></script>
</body>
</html>
